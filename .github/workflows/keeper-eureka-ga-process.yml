name: keeper-eureka
env:
  SERVICE: keeper-eureka
  LAYER: core
  COMPOSE_FILE: keeper-core-compose.yml
  KEEPER_ROOT: /home/ditar/DataDrive/actions-runner/keeper-actions/repositories
on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Gradle build
        run: gradle clean build -x test

      - name: Sync into repositories/${{ env.LAYER }}/${{ env.SERVICE }}
        run: |
          LAYER_DIR="${{ env.KEEPER_ROOT }}/${{ env.LAYER }}"
          DEST="$LAYER_DIR/${{ env.SERVICE }}"
          mkdir -p "$DEST"
          SRC="$(pwd -P)"
          DST="$(cd "$DEST" && pwd -P)"
          if [ "$SRC" != "$DST" ]; then
            rsync -a --exclude '.git' ./ "$DEST/"
          fi

      - name: Compose up ${{ env.SERVICE }}
        run: |
          LAYER_DIR="${{ env.KEEPER_ROOT }}/${{ env.LAYER }}"
          docker compose --project-directory "$LAYER_DIR" \
            --env-file "${{ env.KEEPER_ROOT }}/.env" \
            -f "$LAYER_DIR/${{ env.COMPOSE_FILE }}" \
            up -d --build --no-deps --force-recreate "${{ env.SERVICE }}"
