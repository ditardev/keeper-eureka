name: eureka-action-process
env:
  APPLICATION_NAME : "Keeper-Eureka"
on: 
  push:
    branches: 
      - prod

jobs:
  Keeper-eureka:
    runs-on: self-hosted
    
    steps:
      - name: PrintAppData
        run : |
          echo "Application name: ${{ env.APPLICATION_NAME}}"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: 'false'
      - name: Gradle ${{ env.APPLICATION_NAME}} clean-build
        run : |
          gradle clean build -x test              
      - name: Docker ${{ env.APPLICATION_NAME}} Update
        run : |
          bash ${{ env.APPLICATION_NAME}}_update.sh
      - name: Docker Compose up
        run : |
          cd /home/ditar/DataDrive/actions-runner/keeper-actions/_docker/core
          docker compose -f keeper-core-compose.yml up -d

