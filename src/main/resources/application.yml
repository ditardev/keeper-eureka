spring:
  profiles:
    active: dev
  #    active: prod
  application:
    name: ${server.name}

server:
  shutdown: graceful
  version: ${projectVersion}
  servlet:
    session:
      timeout: 30s

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    serviceUrl:
      defaultZone: http://${server.ip}:${server.port}/eureka
    healthcheck:
      enabled: true
    should-unregister-on-shutdown: true
    registry-fetch-interval-seconds: 30
    eureka-service-url-poll-interval-seconds: 60
  instance:
    hostname: ${server.eureka.hostname:${spring.cloud.client.hostname}}
    prefer-ip-address: ${server.eureka.prefer-ip:true}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

logging:
  level:
    root: ${server.logging.level}
  file:
    name: ${server.logging.filePath}